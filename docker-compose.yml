name: ydisks-deploy

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请配置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请配置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  app:
    image: ${XIANYU_IMAGE:-ghcr.io/christ9038/ydisks-xianyu-helper:latest}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?请配置 DATABASE_URL}
      XIANYU_DATA_KEY: ${XIANYU_DATA_KEY:?请配置 XIANYU_DATA_KEY}
      XIANYU_ADMIN_PASSWORD: ${XIANYU_ADMIN_PASSWORD:?请配置 XIANYU_ADMIN_PASSWORD}
      XIANYU_UPLOAD_DIR: ${XIANYU_UPLOAD_DIR:-/app/data/uploads}
      TZ: ${TZ:-Asia/Shanghai}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      XIANYU_CONTINUE_AFTER_UNCERTAIN: ${XIANYU_CONTINUE_AFTER_UNCERTAIN:-1}
    command: ["/app/xianyu-server", "-addr", ":59188", "-ensure-admin"]
    ports:
      # 强制只绑定宿主机 IPv4 通配地址，不发布任何 IPv6 端口。
      - target: 59188
        published: "${XIANYU_HTTP_PORT:-59188}"
        host_ip: 0.0.0.0
        protocol: tcp
    volumes:
      - app_data:/app/data
      - browser_data:/app/browser_data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:59188/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  # 保持既有 Compose 项目的数据卷名称，升级部署时不创建空数据库替代旧库。
  postgres_data:
    name: ydisks-deploy_postgres_data
  app_data:
    name: ydisks-deploy_app_data
  browser_data:
    name: ydisks-deploy_browser_data
